# ORBIT Helm values (local / test cluster).
# Usage: helm upgrade --install orbit ./deploy/helm/orbit -n orbit --create-namespace -f values.yaml
#
# Default values for the ORBIT Helm chart.
# Production: copy values-prod.example.yaml and use an external database + OIDC.

nameOverride: ""
fullnameOverride: ""

# Private registry (HTTP on the LAN) used by the cluster.
imageRegistry: registry.example.com:5000
imagePullPolicy: IfNotPresent
imagePullSecrets: []

api:
  image: orbit-api
  # Empty tag = Chart.AppVersion (matches the images built for this release).
  tag: ""
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 1
      memory: 512Mi

worker:
  image: orbit-worker
  # Empty tag = Chart.AppVersion.
  tag: ""
  # Scoped token issued by the API (POST /api/v1/worker-tokens). Required.
  token: ""
  replicas: 1
  concurrency: 4
  pollIntervalMs: 500
  schedulerEnabled: true
  # Harness kinds this base worker may claim. OpenCode runs in its own worker image.
  harnesses: mock
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  workspace:
    sizeLimit: 1Gi

# OpenCode worker: separate image because it bundles the OpenCode CLI. Enable after
# providing an OpenCode auth Secret (auth.json from a logged-in OpenCode install).
opencodeWorker:
  enabled: false
  image: orbit-worker-opencode
  # Empty tag = Chart.AppVersion.
  tag: ""
  # Token restricted to the opencode harness. Required when enabled.
  token: ""
  replicas: 1
  concurrency: 2
  harnesses: opencode
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  workspace:
    sizeLimit: 2Gi
  auth:
    # Existing Secret containing `opencode auth export` output.
    #   opencode auth export > auth-export.json
    #   kubectl -n orbit create secret generic orbit-opencode-auth \
    #     --from-file=auth-export.json=./auth-export.json
    existingSecret: ""
    key: auth-export.json
  config:
    # Optional ConfigMap containing opencode.json (key: opencode.json).
    existingConfigMap: ""
    key: opencode.json

# Pi worker: separate image because it bundles the Pi CLI and Node. Enable after
# providing a Pi agent directory Secret (the contents of ~/.pi/agent).
piWorker:
  enabled: false
  image: orbit-worker-pi
  # Empty tag = Chart.AppVersion.
  tag: ""
  # Token restricted to the pi harness. Required when enabled.
  token: ""
  replicas: 1
  concurrency: 2
  harnesses: pi
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 2Gi
  workspace:
    sizeLimit: 2Gi
  auth:
    # Existing Secret mounted at /home/orbit/.pi/agent, e.g.
    #   kubectl -n orbit create secret generic orbit-pi-auth \
    #     --from-file=auth.json=$HOME/.pi/agent/auth.json
    existingSecret: ""

web:
  image: orbit-web
  # Empty tag = Chart.AppVersion.
  tag: ""
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

# Optional worker launcher. Enables Launch/Stop/Logs in Workers. The launcher gets
# namespaced Pod RBAC; the API does not.
launcher:
  enabled: false
  image: orbit-launcher
  # Empty tag = Chart.AppVersion.
  tag: ""
  token: ""
  imagePullSecret: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ─── Authentication ───────────────────────────────────────────
auth:
  # dev  = seeded local user (no IdP). Use only for local/test clusters.
  # oidc = bearer tokens validated against your OIDC provider's JWKS.
  mode: dev
  dev:
    allowAnonymous: true
    token: orbit-dev-token
    userEmail: dev@orbit.local
    userName: ORBIT Developer
    orgSlug: orbit
    orgName: ORBIT
  oidc:
    issuer: ""
    audience: ""
    # OAuth client used by the web login. Defaults to audience.
    clientId: ""
    # Must match the web callback URL registered in Dex/Keycloak.
    redirectUri: ""
    jwksUrl: ""
    scopes: "openid profile email"
    autoProvision: true
    defaultRole: viewer

# ─── Secrets ─────────────────────────────────────────────────
# For production set secrets.create=false and secrets.existingSecret to a Secret you
# manage (Vault/External Secrets/sealed-secrets). Required keys: database-url, master-key.
secrets:
  create: true
  existingSecret: ""
  # 32-byte base64 key. Generate with: openssl rand -base64 32
  # The default is a documented DEVELOPMENT key — replace it for anything real.
  masterKey: b3JiaXQtZGV2LW1hc3Rlci1rZXktMzItYnl0ZXMhISE=
  # Optional: override the computed database URL entirely.
  databaseUrl: ""
  oidcClientSecret: ""

# ─── PostgreSQL ──────────────────────────────────────────────
# Bundled single-instance PostgreSQL for test clusters. For production use an
# external managed database (externalDatabase.enabled=true) instead.
postgresql:
  enabled: true
  image: postgres:17-alpine
  database: orbit
  user: orbit
  password: orbit
  storage: 5Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

externalDatabase:
  enabled: false
  # postgres://user:password@host:5432/orbit?sslmode=require
  url: ""

# ─── NATS JetStream ──────────────────────────────────────────
nats:
  enabled: true
  image: nats:2.11-alpine
  storage: 2Gi
  storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

externalNats:
  enabled: false
  url: ""

# ─── Platform ────────────────────────────────────────────────
platform:
  # This default chart targets local/test clusters (bundled DB/NATS, dev auth).
  # Use values-prod.example.yaml for a production deployment.
  environment: development
  seedDemo: true
  logFormat: json
  corsOrigins: "http://orbit.example.com"
  publicBaseUrl: "http://orbit.example.com"
  bodyLimitBytes: "2097152"

# Optional Vault wiring (secret retrieval is Phase 2; values are injected as env so
# Vault Agent / CSI can be used without chart changes).
vault:
  enabled: false
  addr: ""
  existingSecret: ""

# ─── Ingress ─────────────────────────────────────────────────
ingress:
  enabled: true
  host: orbit.example.com
  ingressClassName: nginx
  tls:
    enabled: false
    secretName: orbit-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

# ─── Reliability ─────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# Extra environment variables for all backend workloads (list of env objects).
extraEnv: []

# Custom CA certificates for environments with private CAs (e.g. corporate proxies).
# Provide a Secret containing a `ca-bundle.crt` key (PEM, may contain multiple certs).
caCertificates:
  enabled: false
  secretName: ""
  key: "ca-bundle.crt"
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# SSE and long-poll friendly termination.
terminationGracePeriodSeconds: 30
