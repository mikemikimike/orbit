{{- if .Values.nats.enabled }}
{{- $name := printf "%s-nats" (include "orbit.fullname" .) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.nats.storageClassName }}
  storageClassName: {{ .Values.nats.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.nats.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "orbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        {{- include "orbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nats
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.nats.runAsNonRoot }}
        fsGroup: {{ .Values.nats.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: {{ .Values.nats.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - containerPort: 4222
              name: nats
            - containerPort: 8222
              name: monitoring
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: nats
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: nats
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  type: ClusterIP
  ports:
    - port: 4222
      targetPort: nats
      name: nats
    - port: 8222
      targetPort: monitoring
      name: monitoring
  selector:
    {{- include "orbit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nats
{{- end }}
