{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbit.fullname" . }}-secrets
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ include "orbit.databaseUrl" . | quote }}
  master-key: {{ required "secrets.masterKey is required (base64, 32 bytes)" .Values.secrets.masterKey | quote }}
  {{- if eq .Values.auth.mode "dev" }}
  dev-token: {{ .Values.auth.dev.token | quote }}
  {{- end }}
  worker-token: {{ required "worker.token is required; issue one with POST /api/v1/worker-tokens" .Values.worker.token | quote }}
  {{- if .Values.opencodeWorker.enabled }}
  opencode-worker-token: {{ required "opencodeWorker.token is required when opencodeWorker.enabled=true" .Values.opencodeWorker.token | quote }}
  {{- end }}
  {{- if .Values.launcher.enabled }}
  launcher-token: {{ required "launcher.token is required when launcher.enabled=true" .Values.launcher.token | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
{{- end }}
