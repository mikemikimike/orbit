apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbit.webHost" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "orbit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "orbit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "orbit.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "orbit.image" (dict "root" . "registry" .Values.imageRegistry "image" .Values.web.image "tag" .Values.web.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Next.js writes image-optimization cache; keep the root filesystem writable.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.web.port }}
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: ORBIT_API_INTERNAL_URL
              value: "http://{{ include "orbit.apiHost" . }}:{{ .Values.api.port }}"
            {{- if eq .Values.auth.mode "dev" }}
            - name: ORBIT_WEB_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbit.secretName" . }}
                  key: dev-token
            {{- end }}
            {{- if .Values.web.extraEnv }}
            {{- toYaml .Values.web.extraEnv | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.caCertificates.enabled }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-bundle.crt
              subPath: {{ .Values.caCertificates.key }}
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        {{- if .Values.caCertificates.enabled }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.caCertificates.secretName }}
        {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbit.webHost" . }}
  labels:
    {{- include "orbit.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "orbit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
