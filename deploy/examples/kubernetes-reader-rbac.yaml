apiVersion: v1
kind: ServiceAccount
metadata:
  name: orbit-agent-reader
  namespace: orbit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orbit-agent-reader
  namespace: payments
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orbit-agent-reader
  namespace: payments
subjects:
  - kind: ServiceAccount
    name: orbit-agent-reader
    namespace: orbit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orbit-agent-reader
