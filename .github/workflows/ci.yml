# CI: tests, lint, security scans and container image builds.
#
# Runs on every push/PR to main and on `v*` tags (which also publish images and the
# release binaries/chart). Superseded runs on the same ref are cancelled automatically,
# except for tags.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push built images to GHCR"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------- rust tests
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Cache only what is reused across commits; target/ grows past the cache limit.
          cache-targets: "true"
          cache-all-crates: "true"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo audit
        uses: rustsec/audit-check@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2024-0449

      - name: cargo test (unit + DB integration)
        env:
          ORBIT_TEST_DATABASE_URL: postgres://orbit:orbit@localhost:5432/orbit
        run: cargo test --workspace

  # ---------------------------------------------------------------- frontend
  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @orbit/web typecheck

      - name: Build
        run: pnpm --filter @orbit/web build

      - name: pnpm audit
        run: pnpm audit --audit-level=high || true

  # ---------------------------------------------------------------- secret scan
  secrets:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

  # ---------------------------------------------------------------- images
  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [rust, web]
    if: ${{ github.event.inputs.push_images == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: deploy/docker/api.Dockerfile
            image: orbit-api
          - name: worker
            dockerfile: deploy/docker/worker.Dockerfile
            image: orbit-worker
          - name: web
            dockerfile: deploy/docker/web.Dockerfile
            image: orbit-web
          - name: launcher
            dockerfile: deploy/docker/launcher.Dockerfile
            image: orbit-launcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event.inputs.push_images == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event.inputs.push_images == 'true' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------ harness worker images
  # Harness images extend the base worker image, so they build after it and reference
  # the base by its commit tag.
  harness-images:
    name: Build harness worker images
    runs-on: ubuntu-latest
    needs: [images]
    if: ${{ github.event.inputs.push_images == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: worker-opencode
            dockerfile: deploy/docker/worker-opencode.Dockerfile
            image: orbit-worker-opencode
          - name: worker-pi
            dockerfile: deploy/docker/worker-pi.Dockerfile
            image: orbit-worker-pi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            WORKER_BASE=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/orbit-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------- releases
  release:
    name: Release binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build worker binary
        run: cargo build --release --target ${{ matrix.target }} -p orbit-worker --bin orbit-worker

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/orbit-worker orbit-worker-linux-${{ matrix.arch }}
          chmod +x orbit-worker-linux-${{ matrix.arch }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: orbit-worker-linux-${{ matrix.arch }}
          generate_release_notes: true

  # ---------------------------------------------------------------- helm release
  chart:
    name: Package Helm chart
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, web]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint chart
        run: helm lint deploy/helm/orbit --set worker.token=lint

      - name: Package chart
        run: |
          mkdir -p dist
          helm package deploy/helm/orbit --destination dist

      - name: Attach chart to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
